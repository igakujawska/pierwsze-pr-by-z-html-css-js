<!DOCTYPE html>

<html lang="pl">
<head>
    <title>kalkulator</title>
    <meta charset="UTF-8">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
<div>
  <h1 class="main-title">ZAKAZANY NA MIMuwu</h1>
  <br>
    <div class="kalkulator">
        <div class="wyswietlacz">
            <div class="inputy">
                <input type="number" id="num1" placeholder="0">
                <input type="number" id="num2" placeholder="0">
            </div>
            <div class="result-box">
             <span class="label"> Wynik: </span> <span id="result">0</span>
            </div>
        </div>
        <div class="buttons-grid">
             <button onclick="oblicz(add)" class="btn btn-operator">+</button>
             <button onclick="oblicz(sub)" class="btn btn-operator">-</button>
             <button onclick="oblicz(mul)" class="btn btn-operator">*</button>
             <button onclick="oblicz(div)" class="btn btn-operator">/</button>
        </div>
    </div>
</div>
<script src="app.js"> </script>

</body>
